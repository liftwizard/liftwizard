repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: end-of-file-fixer
        exclude: ^\.idea/
      - id: trailing-whitespace
        exclude: ^\.idea/
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: just-fmt
        name: just --fmt
        entry: sh -c 'for file do just --fmt --justfile "$file" || exit; done' --
        language: system
        files: '(?i)(^|/)\.?justfile$|\.just$'
        types: [file]
      - id: oxfmt
        name: vp fmt
        entry: vp fmt --no-error-on-unmatched-pattern
        language: system
      - id: prettier-java
        name: prettier-java-next-line
        # Prettier resolves plugins from the working directory, so load the mise-installed plugin by path.
        entry: sh -c 'prettier --plugin "$(mise where npm:prettier-java-next-line)/node_modules/prettier-java-next-line/dist/index.mjs" --write "$@"' --
        language: system
        types: [java]
        # OpenRewrite expected outputs keep the recipe's emitted style, and IntelliJ file templates are not valid Java.
        exclude: '-after\.java$|^\.idea/'
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2 --no-globs
        language: system
        types: [markdown]
