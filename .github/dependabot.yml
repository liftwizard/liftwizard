version: 2
registries:
  # OpenRewrite releases newer than the last ones on Maven Central are only published to the Code Genome Project.
  codegenome:
    type: maven-repository
    url: https://artifacts.codegenomeproject.org/maven
    username: ${{ secrets.CODEGENOME_USERNAME }}
    password: ${{ secrets.CODEGENOME_TOKEN }}
updates:
  - package-ecosystem: "maven"
    directory: "/"
    registries:
      - codegenome
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 99
    target-branch: main
    groups:
      openrewrite:
        patterns:
          - "org.openrewrite*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
      error-prone:
        patterns:
          - "com.google.errorprone*"
          - "tech.picnic.error-prone-support*"
      junit:
        patterns:
          - "org.junit*"
      dropwizard:
        patterns:
          - "io.dropwizard*"
      logging:
        patterns:
          - "org.slf4j*"
          - "ch.qos.logback*"
          - "net.logstash.logback*"
    # Liftwizard stays on Dropwizard 2.x, which pins JUnit 5, Logback 1.2 and SLF4J 1.7. Logback 1.3+ requires SLF4J 2, and logstash-logback-encoder 7.3+ requires Logback 1.3.
    ignore:
      - dependency-name: "org.junit*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.dropwizard*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.slf4j*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ch.qos.logback*"
        versions: [">=1.3.0"]
      - dependency-name: "net.logstash.logback*"
        versions: [">=7.3"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 99
    target-branch: main
