version: 2
registries:
  # OpenRewrite releases newer than the last ones on Maven Central are only published to the Code Genome Project.
  codegenome:
    type: maven-repository
    url: https://artifacts.codegenomeproject.org/maven
    username: ${{ secrets.CODEGENOME_USERNAME }}
    password: ${{ secrets.CODEGENOME_TOKEN }}
updates:
  - package-ecosystem: "maven"
    directory: "/"
    registries:
      - codegenome
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 99
    target-branch: main
    groups:
      openrewrite:
        patterns:
          - "org.openrewrite*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
      error-prone:
        patterns:
          - "com.google.errorprone*"
          - "tech.picnic.error-prone-support*"
      junit:
        patterns:
          - "org.junit*"
      dropwizard:
        patterns:
          - "io.dropwizard*"
      logging:
        patterns:
          - "org.slf4j*"
          - "ch.qos.logback*"
          - "net.logstash.logback*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 99
    target-branch: main
