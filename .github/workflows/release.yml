name: Release

on:
  workflow_dispatch:
    inputs:
      next-version:
        description: "Next development version (e.g., 2.1.35-SNAPSHOT)"
        required: false
        type: string

jobs:
  release:
    permissions:
      contents: write

    name: Create Release Tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 21
          distribution: oracle

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: ./.github/actions/openrewrite-recipes
        with:
          codegenome-username: ${{ secrets.CODEGENOME_USERNAME }}
          codegenome-token: ${{ secrets.CODEGENOME_TOKEN }}
          build-recipes: false

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Prepare Release
        run: |
          mvn --batch-mode clean release:clean release:prepare \
            ${NEXT_VERSION:+-DdevelopmentVersion=$NEXT_VERSION} \
            -Darguments="-DskipTests"
        env:
          NEXT_VERSION: ${{ inputs.next-version }}

      - name: Push changes
        run: |
          git push origin HEAD:main
          git push origin --tags
