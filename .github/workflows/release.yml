name: Release

on:
  workflow_dispatch:
    inputs:
      next-version:
        description: "Next development version (e.g., 2.1.35-SNAPSHOT)"
        required: false
        type: string

jobs:
  release:
    permissions:
      contents: write

    name: Create Release Tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: oracle

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Prepare Release
        run: |
          mvn --batch-mode clean release:clean release:prepare \
            ${NEXT_VERSION:+-DdevelopmentVersion=$NEXT_VERSION} \
            -Darguments="-DskipTests"
        env:
          NEXT_VERSION: ${{ inputs.next-version }}

      - name: Push changes
        run: |
          git push origin HEAD:main
          git push origin --tags
