# Jobs that run on push to main, after pull requests are merged. Jobs here can be a subset of the jobs that run on merge_group. These jobs should never fail since the jobs in merge_group already passed.

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GROUP_ID: "io/liftwizard"

permissions:
  contents: read

jobs:
  # Saves the Maven cache that every pull request and merge queue job restores. Those runs can only restore caches saved on main, so they never save their own. On a cache miss, the warm-up step runs the goals and profiles that only those jobs use, so the cache holds every plugin and plugin dependency they need. The key hashes this file so that changing the warm-up saves a fresh cache.
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: maven-cache
        with:
          key: maven-main-${{ hashFiles('**/pom.xml', '.github/workflows/push.yml') }}
          path: ~/.m2/repository
          restore-keys: |
            maven-main-

      - uses: twosigma/maven-cache-cleaner@8cc87ff622d543e1aad4085cbf5c05236b2d16d9 # v2.3.0

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: ./.github/actions/openrewrite-recipes
        with:
          codegenome-username: ${{ secrets.CODEGENOME_USERNAME }}
          codegenome-token: ${{ secrets.CODEGENOME_TOKEN }}
          build-recipes: false

      - name: Add SLF4J problem matcher
        run: echo "::add-matcher::.github/slf4j.json"

      - run: just mvn

      # `just mvn` already covers the tests and the spotless, enforcer, dependency, javadoc, and checkstyle-semantics profiles. It turns on errorprone-strict, which only sets a flag, without errorprone, so the warm-up adds errorprone to download the Error Prone plugins.
      - name: Warm up the plugins of the other pull request and merge queue jobs
        if: steps.maven-cache.outputs.cache-hit != 'true'
        run: just mvn --target "verify artifact:check-buildplan checkstyle:check" --profiles="--activate-profiles errorprone,errorprone-patch,spotbugs-maven-plugin,jacoco-maven-plugin,checkstyle-formatting" -- --threads 2C -DskipTests -Dcheckstyle.failOnViolation=false

      # Remove any jars we may have created before actions/cache caches .m2
      - name: "Clean Maven cache"
        run: rm -rf ~/.m2/repository/${{ env.GROUP_ID }}

  # Saves the source-available OpenRewrite recipes cache and the rewrite jobs' Maven cache on main, the only branch whose caches every pull request and merge queue run can restore. When the caches already exist, this job only restores them.
  openrewrite-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: maven-cache
        with:
          # Not prefixed with maven-main- so that the other jobs' maven-main- fallback never restores artifacts cached as coming from codegenome, which Maven rechecks against Central in builds without that repository.
          key: codegenome-maven-rewrite-main-${{ hashFiles('**/pom.xml', '.github/workflows/push.yml') }}
          path: ~/.m2/repository
          restore-keys: |
            codegenome-maven-rewrite-main-
            maven-main-

      - uses: twosigma/maven-cache-cleaner@8cc87ff622d543e1aad4085cbf5c05236b2d16d9 # v2.3.0

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: ./.github/actions/openrewrite-recipes
        with:
          codegenome-username: ${{ secrets.CODEGENOME_USERNAME }}
          codegenome-token: ${{ secrets.CODEGENOME_TOKEN }}

      # The run, dryRun, and one-off profiles have different plugin dependencies, so the warm-up runs all three. The one-off command matches openrewrite-one-off.yml.
      - name: Warm up the plugins of the rewrite jobs
        if: steps.maven-cache.outputs.cache-hit != 'true'
        run: |
          just rewrite-run
          just rewrite-dry-run
          mvn rewrite:run -Prewrite-maven-plugin-one-off -DskipLiftwizardRewriteModule

      # Remove any jars we may have created before actions/cache caches .m2
      - name: "Clean Maven cache"
        run: rm -rf ~/.m2/repository/${{ env.GROUP_ID }}
