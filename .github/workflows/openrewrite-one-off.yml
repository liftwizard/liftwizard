# Workflow to run one-off OpenRewrite recipes and create fix branches for review

on:
  workflow_dispatch:

env:
  GROUP_ID: "io/liftwizard"

permissions:
  contents: read

jobs:
  openrewrite-one-off:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: maven-rewrite-${{ hashFiles('**/pom.xml') }}
          path: ~/.m2/repository
          restore-keys: |
            maven-rewrite-
            maven-

      - uses: twosigma/maven-cache-cleaner@8cc87ff622d543e1aad4085cbf5c05236b2d16d9 # v2.3.0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: ./.github/actions/openrewrite-recipes
        with:
          codegenome-username: ${{ secrets.CODEGENOME_USERNAME }}
          codegenome-token: ${{ secrets.CODEGENOME_TOKEN }}

      - name: Build liftwizard-rewrite module
        run: mvn install --projects liftwizard-utility/liftwizard-rewrite -DskipTests -Dspotless.skip -Dspotbugs.skip -Djacoco.skip -Dcheckstyle.skip -Denforcer.skip

      - name: Run OpenRewrite one-off recipes
        run: mvn rewrite:run -Prewrite-maven-plugin-one-off -DskipLiftwizardRewriteModule

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and commit changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="openrewrite-fixes-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "Apply OpenRewrite one-off recipes."
          git push origin "$BRANCH_NAME"

      # Remove any jars we may have created before actions/cache caches .m2
      - name: "Clean Maven cache"
        run: rm -rf ~/.m2/repository/${{ env.GROUP_ID }}
