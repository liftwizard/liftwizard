[settings]
# Skip releases younger than 24 hours when mise chooses a version (`mise upgrade`, `latest`, ranges), enforcing the 24-hour version policy. An exact version pinned here still installs.
minimum_release_age = "1d"

[tools]
java = "temurin-21.0.12+101.0.LTS"
just = "1.58.0"
maven = "3.10.0"
mvnd = "1.0.6"
node = "24.21.0"
pre-commit = "4.6.2"
"npm:markdownlint-cli2" = "0.23.3"
"npm:prettier" = "3.9.10"
"npm:prettier-java-next-line" = { version = "2.11.4", allow_low_downloads = true }
"npm:strip-ansi-cli" = "4.0.0"
"npm:oxfmt-next-line" = { version = "0.75.0", allow_low_downloads = true }

[tool_alias]
mvnd = "asdf:https://github.com/joschi/asdf-mvnd"

[env]
TERM = 'xterm-256color'
