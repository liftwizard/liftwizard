---
type: specs.openrewrite.org/v1beta/style
name: io.liftwizard.NoStarImports
styleConfigs:
  # Matches useTabs and tabWidth in .prettierrc.json5. Without this, OpenRewrite indents the lines it rewrites with
  # spaces while the untouched lines keep their tabs.
  - org.openrewrite.java.style.TabsAndIndentsStyle:
      useTabCharacter: true
      tabSize: 4
      indentSize: 4
      continuationIndent: 8
  # The groups mirror the order that spotless importOrder and the CustomImportOrder Checkstyle rule already enforce,
  # so that an import a recipe adds lands where those two would have put it.
  - org.openrewrite.java.style.ImportLayoutStyle:
      classCountToUseStarImport: 9999
      nameCountToUseStarImport: 9999
      layout:
        - "import java.*"
        - "<blank line>"
        - "import javax.*"
        - "<blank line>"
        - "import all other imports"
        - "<blank line>"
        - "import static all other imports"
  - org.openrewrite.java.style.SpacesStyle:
      other:
        beforeComma: false
        afterComma: true
        beforeForSemicolon: false
        afterForSemicolon: true
        afterTypeCast: true
        beforeColonInForEach: true
        insideOneLineEnumBraces: false
